name: Constitution Compliance Check

# Workflow de validación de cumplimiento de convenciones del proyecto
# Verifica adherencia a principios definidos en DOCUMENTACIÓN/Info_Github.md
# Se ejecuta en PRs a dev y main para garantizar estándares de calidad

on:
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

jobs:
  validate-commits:
    runs-on: ubuntu-latest
    name: Validar Formato de Commits

    steps:
      - name: Checkout código
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Necesario para git log completo

      - name: Validar formato de commits
        id: check-commits
        run: |
          echo "🔍 Validando formato de commits según DOCUMENTACIÓN/Info_Github.md..."
          echo ""
          echo "Formato esperado: tipo(módulo): descripción corta (primera línea ≤72 caracteres)"
          echo "Tipos válidos: feat, fix, docs, style, refactor, test, chore, perf"
          echo ""

          # Obtener commits entre base branch y HEAD (solo subject)
          BASE_BRANCH="${{ github.base_ref }}"
          COMMITS=$(git log --format=%s origin/$BASE_BRANCH..${{ github.sha }} 2>/dev/null || echo "")

          if [ -z "$COMMITS" ]; then
            echo "⚠️  No se encontraron commits para validar"
            echo "total=0" >> $GITHUB_OUTPUT
            echo "invalid=0" >> $GITHUB_OUTPUT
            echo "long_subjects=0" >> $GITHUB_OUTPUT
            exit 0
          fi

          INVALID_COMMITS=0
          TOTAL_COMMITS=0
          LONG_SUBJECTS=0

          while IFS= read -r commit_msg; do
            TOTAL_COMMITS=$((TOTAL_COMMITS + 1))
            invalid=0

            # Regex según Info_Github.md: tipo(módulo): descripción corta (tipos de la tabla)
            if [[ ! "$commit_msg" =~ ^(feat|fix|docs|style|refactor|test|chore|perf)\([a-zA-Z0-9_-]+\):\ .+ ]]; then
              echo "❌ Formato inválido: $commit_msg"
              INVALID_COMMITS=$((INVALID_COMMITS + 1))
              invalid=1
            else
              echo "✅ Formato válido: $commit_msg"
            fi

            # Regla Info_Github: primera línea ≤72 caracteres
            if [ $invalid -eq 0 ] && [ ${#commit_msg} -gt 72 ]; then
              echo "   ⚠️ Primera línea >72 caracteres (${#commit_msg})"
              LONG_SUBJECTS=$((LONG_SUBJECTS + 1))
            fi
          done <<< "$COMMITS"

          echo ""
          echo "📊 Resumen:"
          echo "   Total commits: $TOTAL_COMMITS"
          echo "   Commits válidos: $((TOTAL_COMMITS - INVALID_COMMITS))"
          echo "   Commits inválidos: $INVALID_COMMITS"
          if [ $LONG_SUBJECTS -gt 0 ]; then
            echo "   Subjects >72 chars: $LONG_SUBJECTS (recomendado ≤72)"
          fi

          # Guardar para usar en summary
          echo "total=$TOTAL_COMMITS" >> $GITHUB_OUTPUT
          echo "invalid=$INVALID_COMMITS" >> $GITHUB_OUTPUT
          echo "long_subjects=$LONG_SUBJECTS" >> $GITHUB_OUTPUT

          if [ $INVALID_COMMITS -gt 0 ]; then
            echo ""
            echo "::warning::Se encontraron $INVALID_COMMITS commits con formato inválido"
            echo "::warning::Formato (Info_Github.md): tipo(módulo): descripción corta"
            echo "::warning::Ejemplo: feat(alertas): agregar sistema SMS"
          fi
          if [ $LONG_SUBJECTS -gt 0 ]; then
            echo "::warning::$LONG_SUBJECTS commit(s) con primera línea >72 caracteres. Recomendado ≤72."
          fi

      - name: Verificar referencias a issues
        id: check-issues
        run: |
          echo "🔍 Verificando referencias a issues en commits significativos..."
          echo ""

          BASE_BRANCH="${{ github.base_ref }}"

          # Commits que NO son docs/chore/style (requieren issue reference)
          SIGNIFICANT_COMMITS=$(git log --format=%B origin/$BASE_BRANCH..${{ github.sha }} | \
            grep -v "^docs:" | \
            grep -v "^chore:" | \
            grep -v "^style:" 2>/dev/null || echo "")

          if [ -z "$SIGNIFICANT_COMMITS" ]; then
            echo "ℹ️  No hay commits significativos para validar"
            echo "has_missing=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Verificar si tienen referencia a issue (#número)
          COMMITS_WITHOUT_ISSUE=$(echo "$SIGNIFICANT_COMMITS" | grep -v "#[0-9]" || true)

          if [ ! -z "$COMMITS_WITHOUT_ISSUE" ]; then
            echo "⚠️  Algunos commits significativos no referencian issues:"
            echo "$COMMITS_WITHOUT_ISSUE"
            echo ""
            echo "::warning::Se recomienda referenciar issues en commits feat/fix/refactor (Info_Github.md)"
            echo "::warning::Formato: Issue: #numero o Closes: #numero en el cuerpo del commit"
            echo "has_missing=true" >> $GITHUB_OUTPUT
          else
            echo "✅ Todos los commits significativos referencian issues"
            echo "has_missing=false" >> $GITHUB_OUTPUT
          fi

      - name: Generar resumen de validación
        if: always()
        run: |
          echo "## 📋 Validación de Constitución - Commits" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Resultado |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Formato de commits (Info_Github.md) | ${{ steps.check-commits.outputs.invalid == '0' && '✅ Todos válidos' || format('⚠️ {0} inválidos', steps.check-commits.outputs.invalid) }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Primera línea ≤72 chars | ${{ steps.check-commits.outputs.long_subjects == '0' && '✅' || format('⚠️ {0} >72', steps.check-commits.outputs.long_subjects) }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Referencias a issues (Issue/Closes #n) | ${{ steps.check-issues.outputs.has_missing == 'false' && '✅ Completo' || '⚠️ Algunas faltantes' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📖 Principios Aplicados" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Principio II**: Git Flow Estructurado - Formato de commits" >> $GITHUB_STEP_SUMMARY
          echo "- **Principio III**: Gestión GitHub-First - Referencias a issues" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Ver convenciones: \`DOCUMENTACIÓN/Info_Github.md\`" >> $GITHUB_STEP_SUMMARY

      - name: Comentar en PR si hay issues
        if: |
          always() &&
          github.event_name == 'pull_request' &&
          (steps.check-commits.outputs.invalid != '0' || steps.check-issues.outputs.has_missing == 'true')
        uses: actions/github-script@v9
        with:
          script: |
            const invalidCommits = '${{ steps.check-commits.outputs.invalid }}';
            const hasMissingIssues = '${{ steps.check-issues.outputs.has_missing }}';

            let message = '## ⚠️ Validación de Constitución\n\n';

            if (invalidCommits !== '0') {
              message += `### Formato de Commits\n\n`;
              message += `Se encontraron **${invalidCommits} commits** con formato inválido.\n\n`;
              message += `**Formato obligatorio** según \`DOCUMENTACIÓN/Info_Github.md\`:\n`;
              message += '```\n';
              message += 'tipo(módulo): descripción corta\n\n';
              message += 'Detalles de cambios realizados.\n\n';
              message += 'Issue: #123\n';
              message += '```\n\n';
              message += `**Tipos válidos**: \`feat\`, \`fix\`, \`docs\`, \`style\`, \`refactor\`, \`test\`, \`chore\`, \`perf\` (primera línea ≤72 caracteres).\n\n`;
            }

            if (hasMissingIssues === 'true') {
              message += `### Referencias a Issues\n\n`;
              message += `Algunos commits significativos no referencian issues de GitHub.\n\n`;
              message += `**Regla** (Info_Github.md): Incluir \`Issue: #numero\` o \`Closes: #numero\` en el cuerpo del commit.\n\n`;
            }

            message += `---\n`;
            message += `📖 **Referencia**: [Convenciones del Proyecto](DOCUMENTACIÓN/Info_Github.md)\n`;
            message += `💡 **Nota**: Estas validaciones son **informativas**, no bloquean el merge.\n`;

            // Verificar si ya existe comentario similar
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('Validación de Constitución')
            );

            if (botComment) {
              // Actualizar comentario existente
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: message
              });
            } else {
              // Crear nuevo comentario
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: message
              });
            }
